name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # 실제 Postgres + Redis로 API·워커를 띄워 부하 테스트를 짧게 돌린다.
  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fsa, POSTGRES_PASSWORD: fsa, POSTGRES_DB: fsa }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fsa" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      FSA_DATABASE_URL: postgresql+asyncpg://fsa:fsa@localhost:5432/fsa
      FSA_REDIS_URL: redis://localhost:6379/0
      FSA_JWT_SECRET: ci-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: |
          uvicorn factory_agent.main:app --port 8000 &
          fsa-worker &
          fsa-worker &
          for i in $(seq 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          python scripts/loadtest.py --users 5 --jobs-per-user 4 --orders 15 --time-limit 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t factory-scheduling-agent .
