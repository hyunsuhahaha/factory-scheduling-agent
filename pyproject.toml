[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-scheduling-agent"
version = "0.1.0"
description = "LLM agent backend that optimizes factory production schedules via MCP tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "ortools>=9.10",
    # numpy 2.3+ 휠의 일부 DLL이 Windows 앱 제어 정책에 막히는 환경이 있어 상한을 둔다.
    "numpy>=2.0.2,<2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.23"]

[project.scripts]
fsa-worker = "factory_agent.worker:main"
fsa-mcp = "factory_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["factory_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
